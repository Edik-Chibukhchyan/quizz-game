<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- skzbi ekran -->
    <main id="start-screen" class="screen">

        <h1>Ինտելեկտուալ խաղ</h1>

        <p class="description">
            Ստուգիր քո գիտելիքները՝ պատասխանելով 20 հարցի և ստացիր պատվանուն:
        </p>

        <button id="start-button">
            Սկսել խաղը
        </button>

    </main>


    <!-- xaxi ekran -->
    <main id="game-screen" class="screen hidden">

        <div class="game-header">
            <span id="question-number">Հարց 1 / 20</span>
            <span id="timer">01:00</span>
        </div>

        <h2 id="question">
            aystex klini harcy
        </h2>

        <div id="answers">

            <button class="answer-button">Ответ 1</button>
            <button class="answer-button">Ответ 2</button>
            <button class="answer-button">Ответ 3</button>
            <button class="answer-button">Ответ 4</button>

        </div>

        <div class="bonuses">

            <button id="fifty-button">
                50/50
            </button>

            <button id="change-button">
                Փոխել հարցը
            </button>

            <button id="hint-button">
                Օգնություն
            </button>

        </div>

        <p id="hint-text" class="hidden"></p>

    </main>

        <!-- ardyunqi ekran -->
    <main id="result-screen" class="screen hidden">

        <h1>Խաղն ավարտվեց:</h1>

        <p id="final-score"></p>

        <h2 id="final-title"></h2>

        <p id="final-comment"></p>

        <button id="restart-button">
            Նորից խաղալ
        </button>

    </main>


    <script src="script.js"></script>

</body>
</html>
